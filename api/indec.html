/* ActiveCampaign integration (from old code) */
const AC_SUBMIT_URL = 'https://spinalhealthhub-two.vercel.app/api/ac-submit';
const SUBTYPE_TAGS = {

};

function trackMeta(eventName, params) {
  if (typeof window.fbq !== 'function') return;
  if (params) fbq('track', eventName, params);
  else fbq('track', eventName);
}

async function syncActiveCampaign(email, subtype, confidence, runnerUp, margin) {
  const tag = SUBTYPE_TAGS[subtype];
  if (!tag || !email) return;

  const res = await fetch(AC_SUBMIT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      email: email.trim(),
      tag,
      confidence: confidence || '',
      runnerUp: runnerUp || '',
      margin: margin,
    }),
  });

  const data = await res.json().catch(() => ({}));
  if (!res.ok || !data.ok) {
    throw new Error(data.error || 'ActiveCampaign sync failed');
  }
}

/* ---------- QUESTIONS ---------- */

  { id: 'analysis', type: 'analysis' },

/* ---------- STATE ---------- */
const state = {
  step: 0,
  answers: {},
  email: '',
  subtype: null,
  scores: { holder: 0, slumper: 0, hanger: 0, shifter: 0 },
  runnerUp: null,
  margin: 0,
  confidence: null,
  isAdvancing: false,
  shouldAnimate: true,
  safetyOpen: false,
  emailSubmitting: false,
  metaEvents: { viewContent: false, completeRegistration: false },
};

const numberedStepIds = QUESTIONS
  .filter(q => ['single','multi','silhouette'].includes(q.type))
  .map(q => q.id);

const $app = document.getElementById('quizApp');
const $devNav = document.getElementById('devNav');

/* ---------- HELPERS ---------- */
function currentQuestion() { return QUESTIONS[state.step]; }
function questionNumber(q) {
  const idx = numberedStepIds.indexOf(q.id);
  return idx === -1 ? null : idx + 1;
}
function progressPct() {
  if (state.step === 0) return 0;
  const q = currentQuestion();
  if (q.type === 'result' || q.type === 'analysis' || q.type === 'email') return 100;
  const numbered = questionNumber(q);
  if (numbered === null) return Math.min(8, (state.step / QUESTIONS.length) * 100);
  return Math.round((numbered / numberedStepIds.length) * 100);
}
function isAnswered(q) {
  const ans = state.answers[q.id];
  if (q.type === 'multi') return Array.isArray(ans) && ans.length > 0;
  if (q.type === 'email') return state.email && /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(state.email);
  return !!ans;
}

/* ---------- NAVIGATION ---------- */
function goToStep(idx) {
  state.isAdvancing = false;
  state.step = Math.max(0, Math.min(QUESTIONS.length - 1, idx));
  state.shouldAnimate = true;
  state.safetyOpen = false;
  if (currentQuestion().type === 'analysis') computeSubtype();
  render();
}
function next() { goToStep(state.step + 1); }
function back() { goToStep(state.step - 1); }

function setAnswerAndAdvance(qId, optionId) {
  if (state.isAdvancing) return;
  state.answers[qId] = optionId;
  state.isAdvancing = true;
  state.shouldAnimate = false;
  render();
  setTimeout(() => {
    state.isAdvancing = false;
    next();
  }, 280);
}

function toggleMulti(qId, optionId) {
  if (!state.answers[qId]) state.answers[qId] = [];
  const arr = state.answers[qId];
  const idx = arr.indexOf(optionId);
  if (idx > -1) arr.splice(idx, 1); else arr.push(optionId);
  state.shouldAnimate = false;
  render();
}

function toggleSafetyDetail() {
  state.safetyOpen = !state.safetyOpen;
  state.shouldAnimate = false;
  render();
}

/* ---------- SCORING ---------- */
function computeSubtype() {
  const scores = { holder: 0, slumper: 0, hanger: 0, shifter: 0 };
  for (const q of QUESTIONS) {
    if (!q.scoreKey) continue;
    const ans = state.answers[q.id];
    if (!ans) continue;
    const opt = q.options.find(o => o.id === ans);
    if (!opt) continue;
    const adds = SCORING[q.scoreKey][opt.id];
    if (!adds) continue;
    for (const subtype in adds) scores[subtype] += adds[subtype];
  }
  state.scores = scores;
  const order = ['holder', 'slumper', 'hanger', 'shifter'];
  let maxScore = -1, winner = 'holder';
  for (const s of order) {
    if (scores[s] > maxScore) { maxScore = scores[s]; winner = s; }
  }
  state.subtype = winner;

  const sortedScores = order.slice().sort((a, b) => scores[b] - scores[a]);
  state.runnerUp = sortedScores[1];
  state.margin = scores[winner] - scores[state.runnerUp];
  if (state.margin >= 5)      state.confidence = 'high';
  else if (state.margin >= 3) state.confidence = 'good';
  else if (state.margin >= 1) state.confidence = 'thin';
  else                        state.confidence = 'tied';
}

/* ---------- RENDERERS ---------- */
function cardClass() {
  return state.shouldAnimate ? 'card is-entering' : 'card';
}

        </h1>

        </p>
        <button class="intro-cta" data-action="start">
          Discover my back type
          <span class="intro-cta-arrow">&rarr;</span>
        </button>
        <div class="intro-separator"></div>

          Developed by <strong>Troy Sandley</strong>, AHPRA-registered physiotherapist.<br>
          Informed by the RESTORE trial (Lancet, 2023).
        </div>
        <div class="intro-disclosure">
          Spinal Health Hub is an educational wellness platform. It is not a diagnostic tool and does not constitute medical advice.<br>
          <a href="#">About Troy</a> &middot; <a href="#">Disclosures</a> &middot; <a href="#">Privacy</a> &middot; <a href="#">Terms</a>
        </div>
      </div>
    </div>
  `;
  $app.querySelector('[data-action="start"]').addEventListener('click', next);
  if (!state.metaEvents.viewContent) {
    state.metaEvents.viewContent = true;
    trackMeta('ViewContent', { content_name: 'Back-Type Quiz Intro' });
  }
}

function renderQuizShell(innerHtml) {
  return `
    <header class="quiz-header">
      ${LOGO_SAGE}
      <span class="step-indicator" id="stepIndicator"></span>
    </header>
    <div class="progress-wrap"><div class="progress-fill" id="progressFill"></div></div>
    <main class="stage">
      <div class="card-wrap">${innerHtml}</div>
    </main>
  `;
}

function updateChrome() {
  const $progress = document.getElementById('progressFill');
  const $stepIndicator = document.getElementById('stepIndicator');
  if ($progress) $progress.style.width = progressPct() + '%';
  if ($stepIndicator) {
    const q = currentQuestion();
    const num = questionNumber(q);
    $stepIndicator.innerHTML = num !== null ? `<strong>${num}</strong> / ${numberedStepIds.length}` : '';
  }
}

function renderSafety() {
  const isOpen = state.safetyOpen;
  const inner = `
    <div class="${cardClass()}">
      <p class="eyebrow">Safety check</p>
      <h2 class="question-title">A quick safety check before we begin.</h2>
      <p class="safety-intro">Some unusual symptoms are best reviewed by a healthcare professional before starting a movement program.</p>
      <button class="safety-toggle ${isOpen ? 'is-open' : ''}" data-action="toggle">
        <svg class="safety-toggle-icon" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 4.5 6 7.5 9 4.5"/>
        </svg>
        ${isOpen ? 'Hide the unusual symptoms to check for' : 'Show me the unusual symptoms to check for'}
      </button>
      <div class="safety-detail ${isOpen ? 'is-open' : ''}">

          <ul>
            <li>Bladder or bowel changes</li>
            <li>Numbness in your groin or inner thighs</li>
            <li>Unexplained weight loss</li>
            <li>Fever</li>
            <li>Unrelenting night pain</li>
            <li>Leg weakness, numbness, or pins and needles that is getting worse over time, or affects both legs</li>
            <li>Recent significant injury or trauma to your back</li>
          </ul>
        </div>
      </div>
      <p class="safety-footnote">If any of these apply to you, we recommend consulting your healthcare provider. You may continue for educational purposes.</p>
      <div class="nav-row">
        <button class="btn btn-secondary" data-action="back">Go back</button>
        <button class="btn btn-primary" data-action="continue">Continue</button>
      </div>
    </div>
  `;
  $app.innerHTML = renderQuizShell(inner);
  $app.querySelector('[data-action="toggle"]').addEventListener('click', toggleSafetyDetail);
  $app.querySelector('[data-action="back"]').addEventListener('click', back);
  $app.querySelector('[data-action="continue"]').addEventListener('click', next);
}

function renderSingle() {
  const q = currentQuestion();
  const selected = state.answers[q.id];
  const num = questionNumber(q);
  const optionsHtml = q.options.map(opt => `
    <button class="option ${selected === opt.id ? 'is-selected' : ''}" data-option-id="${opt.id}">
      ${opt.label}
    </button>
  `).join('');
  const inner = `
    <div class="${cardClass()}">
      <p class="eyebrow">Question ${num} of ${numberedStepIds.length}</p>
      <h2 class="question-title">${q.title}</h2>
      ${q.hint ? `<p class="question-hint">${q.hint}</p>` : ''}
      <div class="options">${optionsHtml}</div>
      <div class="nav-row">
        <button class="btn btn-secondary" data-action="back">Back</button>
      </div>
    </div>
  `;
  $app.innerHTML = renderQuizShell(inner);
  $app.querySelectorAll('.option').forEach(btn => {
    btn.addEventListener('click', () => setAnswerAndAdvance(q.id, btn.dataset.optionId));
  });
  $app.querySelector('[data-action="back"]').addEventListener('click', back);
}

function renderMulti() {
  const q = currentQuestion();
  const selected = state.answers[q.id] || [];
  const num = questionNumber(q);
  const optionsHtml = q.options.map(opt => `
    <button class="option is-multi ${selected.includes(opt.id) ? 'is-selected' : ''}" data-option-id="${opt.id}">
      ${opt.label}
    </button>
  `).join('');
  const inner = `
    <div class="${cardClass()}">
      <p class="eyebrow">Question ${num} of ${numberedStepIds.length}</p>
      <h2 class="question-title">${q.title}</h2>
      ${q.hint ? `<p class="question-hint">${q.hint}</p>` : ''}
      <div class="options">${optionsHtml}</div>
      <div class="nav-row">
        <button class="btn btn-secondary" data-action="back">Back</button>
        <button class="btn btn-primary" data-action="next" ${isAnswered(q) ? '' : 'disabled'}>Next</button>
      </div>
    </div>
  `;
  $app.innerHTML = renderQuizShell(inner);
  $app.querySelectorAll('.option').forEach(btn => {
    btn.addEventListener('click', () => toggleMulti(q.id, btn.dataset.optionId));
  });
  $app.querySelector('[data-action="back"]').addEventListener('click', back);
  $app.querySelector('[data-action="next"]').addEventListener('click', () => { if (isAnswered(q)) next(); });
}

function renderSilhouette() {
  const q = currentQuestion();
  const selected = state.answers[q.id];
  const num = questionNumber(q);
  const cellsHtml = q.options.map(opt => {
    let figureHtml;
    let optClass = '';
    if (opt.figure === 'shifter-text') {
      figureHtml = `${SHIFTER_ICON}<span>${opt.textContent}</span>`;
      optClass = 'shifter-text-card';
    } else {
      figureHtml = `<div class="silhouette-placeholder" data-figure="${opt.figure}">
        Silhouette image<br>${opt.figure}<br>(to be added)
      </div>`;
    }
    return `
      <button class="silhouette-option ${optClass} ${selected === opt.id ? 'is-selected' : ''}" data-option-id="${opt.id}">
        <span class="silhouette-label">${opt.label}</span>
        <span class="silhouette-figure">${figureHtml}</span>
      </button>
    `;
  }).join('');
  const inner = `
    <div class="${cardClass()}">
      <p class="eyebrow">Question ${num} of ${numberedStepIds.length}</p>
      <h2 class="question-title">${q.title}</h2>
      <div class="silhouette-grid">${cellsHtml}</div>
      <div class="nav-row">
        <button class="btn btn-secondary" data-action="back">Back</button>
      </div>
    </div>
  `;
  $app.innerHTML = renderQuizShell(inner);
  $app.querySelectorAll('.silhouette-option').forEach(btn => {
    btn.addEventListener('click', () => setAnswerAndAdvance(q.id, btn.dataset.optionId));
  });
  $app.querySelector('[data-action="back"]').addEventListener('click', back);
}

function renderEmail() {
  const q = currentQuestion();
  const inner = `
    <div class="${cardClass()}">
      <h2 class="question-title email-title">${q.title}</h2>
      <input type="email" class="email-field" id="emailInput"
             placeholder="you@example.com" value="${state.email}"
             autocomplete="email" inputmode="email">
      <p class="email-microcopy">
        We'll send them to this address. Unsubscribe anytime.
        See our <a href="#" target="_blank">privacy policy</a>.
      </p>
      <div class="nav-row">
        <button class="btn btn-secondary" data-action="back">Back</button>
        <button class="btn btn-primary" id="emailSubmit" data-action="submit" ${isAnswered(q) ? '' : 'disabled'}>Send me my result</button>
      </div>
    </div>
  `;
  $app.innerHTML = renderQuizShell(inner);
  const $emailInput = document.getElementById('emailInput');
  const $emailSubmit = document.getElementById('emailSubmit');
  $emailInput.addEventListener('input', e => {
    state.email = e.target.value;
    $emailSubmit.disabled = !isAnswered(q);
  });
  $emailInput.addEventListener('keydown', e => {
    if (e.key === 'Enter' && isAnswered(q)) submitEmail();
  });
  $app.querySelector('[data-action="back"]').addEventListener('click', back);
  $emailSubmit.addEventListener('click', submitEmail);
}

async function submitEmail() {
  const q = currentQuestion();
  if (!isAnswered(q) || state.emailSubmitting) return;

  computeSubtype();
  state.emailSubmitting = true;
  trackMeta('Lead');

  const $emailSubmit = document.getElementById('emailSubmit');
  const prevLabel = $emailSubmit ? $emailSubmit.textContent : '';
  if ($emailSubmit) {
    $emailSubmit.disabled = true;
    $emailSubmit.textContent = 'Sending…';
  }

  try {
    await syncActiveCampaign(state.email, state.subtype, state.confidence, state.runnerUp, state.margin);
  } catch (err) {
    console.warn('ActiveCampaign sync failed:', err);
  }

  state.emailSubmitting = false;
  next();
  if ($emailSubmit) $emailSubmit.textContent = prevLabel;
}

function renderInterstitial() {
  const q = currentQuestion();
  const animClass = state.shouldAnimate ? ' is-entering' : '';
  $app.innerHTML = renderQuizShell(`
    <div class="interstitial-card${animClass}">
      <p class="interstitial-eyebrow">${q.eyebrow}</p>
      <p class="interstitial-body">${q.body}</p>
      <div class="nav-row interstitial-nav">
        <button class="btn btn-secondary" data-action="back">Back</button>
        <button class="btn btn-primary" data-action="continue">Continue</button>
      </div>
    </div>
  `);
  $app.querySelector('[data-action="continue"]').addEventListener('click', next);
  $app.querySelector('[data-action="back"]').addEventListener('click', back);
}

const REDIRECTS = {
  holder:  'https://spinalhealthhub.com.au/quiz/thank-you',
  slumper: 'https://spinalhealthhub.com.au/quiz/thank-you',
  hanger:  'https://spinalhealthhub.com.au/quiz/thank-you',
  shifter: 'https://spinalhealthhub.com.au/quiz/thank-you',
};

function buildRedirectUrl() {
  const motivations = Array.isArray(state.answers.motivations)
    ? state.answers.motivations.join(',')
    : '';
  const params = new URLSearchParams({
    backType: state.subtype,
    runnerUp: state.runnerUp,
    margin: state.margin,
    confidence: state.confidence,
    motivations: motivations,
  });
  return `${REDIRECTS[state.subtype]}?${params.toString()}`;
}

function renderAnalysis() {
  const redirectUrl = buildRedirectUrl();
  const motivations = Array.isArray(state.answers.motivations)
    ? state.answers.motivations.join(', ')
    : '(none)';

  const THEATRE_ICON_SVG = `
    <svg class="theatre-icon-hourglass" viewBox="0 0 26 26" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path class="hg-sand-top" d="M 7.5 4.5 L 18.5 4.5 L 13 12 Z" />
      <rect class="hg-stream" x="12.5" y="11" width="1" height="4" />
      <path class="hg-sand-bottom" d="M 13 14 L 18.5 21.5 L 7.5 21.5 Z" />
      <path class="hg-frame" d="M 6.5 3.5 L 19.5 3.5 M 6.5 22.5 L 19.5 22.5 M 7.5 4.5 L 7.5 6 L 13 13 L 7.5 20 L 7.5 21.5 M 18.5 4.5 L 18.5 6 L 13 13 L 18.5 20 L 18.5 21.5" />
    </svg>
    <svg class="theatre-icon-tick" viewBox="0 0 26 26" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <circle cx="13" cy="13" r="11" fill="var(--sage)" />
      <path d="M 7.5 13.5 L 11.5 17 L 18.5 9.5" fill="none" stroke="var(--cream)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  `;

  const STEPS = [
    { id: 'theatreLine0', main: 'Reviewing your symptom profile',                          sub: 'Background and reported symptoms',                                    duration: 1600 },
    { id: 'theatreLine1', main: 'Analysing your postural patterns',                        sub: 'Postural self-image and automatic positioning',                       duration: 2000 },
    { id: 'theatreLine2', main: 'Mapping your response to common movement and loading situations', sub: 'How your back responds across sitting, standing, walking, and lifting', duration: 2600 },
    { id: 'theatreLine3', main: 'Reviewing your behaviour through discomfort',             sub: 'How you respond when your back acts up',                              duration: 2200 },
    { id: 'theatreLine4', main: 'Matching to one of four back types',                      sub: 'Cross-referencing your responses with the four-pattern framework',    duration: 3200 },
  ];

  const stepsHtml = STEPS.map(s => `
    <div class="theatre-line" id="${s.id}" style="--step-duration: ${s.duration}ms;">
      <span class="theatre-icon">${THEATRE_ICON_SVG}</span>
      <span class="theatre-line-text">
        <span class="theatre-line-main">${s.main}</span>
        <span class="theatre-line-sub">${s.sub}</span>
      </span>
    </div>
  `).join('');

  $app.innerHTML = `
    <div class="theatre-screen">
      <div class="theatre-lines">
        ${stepsHtml}
      </div>
      <div class="theatre-reveal" id="theatreReveal">
        <button class="theatre-reveal-cta" id="theatreRevealCta" data-action="reveal">
          Get my back type
          <span class="arrow">&rarr;</span>
        </button>
      </div>
      <div class="result-debug" style="margin-top: 64px;">
        <strong>DEBUG (remove before launch):</strong><br>
        Subtype: ${state.subtype}<br>
        Scores: H ${state.scores.holder} &middot; Sl ${state.scores.slumper} &middot; Hg ${state.scores.hanger} &middot; Sh ${state.scores.shifter}<br>
        Confidence: <strong>${state.confidence}</strong> (margin ${state.margin} over runner-up: ${state.runnerUp})<br>
        Email captured: ${state.email || '(none)'}<br>
        Motivations: ${motivations || '(none)'}<br>
        Would redirect to: ${redirectUrl}
      </div>
    </div>
  `;

  let cursor = 100;
  STEPS.forEach((step, i) => {
    setTimeout(() => {
      document.getElementById(step.id)?.classList.add('is-visible');
      if (i > 0) {
        document.getElementById(STEPS[i - 1].id)?.classList.add('is-done');
      }
    }, cursor);
    cursor += step.duration;
  });
  const finalDoneAt = cursor;
  setTimeout(() => {
    document.getElementById(STEPS[STEPS.length - 1].id)?.classList.add('is-done');
  }, finalDoneAt);
  setTimeout(() => {
    document.getElementById('theatreReveal')?.classList.add('is-visible');
  }, finalDoneAt + 600);

  const revealBtn = document.getElementById('theatreRevealCta');
  if (revealBtn) {
    revealBtn.addEventListener('click', () => {
      revealBtn.disabled = true;
      next();
    });
  }
}

function renderResult() {
  const redirectUrl = buildRedirectUrl();
  const motivations = Array.isArray(state.answers.motivations)
    ? state.answers.motivations.join(', ')
    : '(none)';

  if (!state.metaEvents.completeRegistration) {
    state.metaEvents.completeRegistration = true;
    trackMeta('CompleteRegistration', {
      content_name: 'Back-Type Quiz Result',
      content_category: state.subtype,
    });
  }

  $app.innerHTML = `
    <div class="theatre-screen">
      <div class="result-redirect">
        <span class="spinner spinner-large"></span>
        <p class="result-redirect-text">Sending you to your result...</p>
      </div>
      <div class="result-debug" style="margin-top: 64px;">
        <strong>DEBUG (remove before launch):</strong><br>
        Subtype: ${state.subtype}<br>
        Scores: H ${state.scores.holder} &middot; Sl ${state.scores.slumper} &middot; Hg ${state.scores.hanger} &middot; Sh ${state.scores.shifter}<br>
        Confidence: <strong>${state.confidence}</strong> (margin ${state.margin} over runner-up: ${state.runnerUp})<br>
        Email captured: ${state.email || '(none)'}<br>
        Motivations: ${motivations}<br>
        Would redirect to: ${redirectUrl}
      </div>
    </div>
  `;

//   Uncomment when result pages are live:
  setTimeout(() => { window.location.href = redirectUrl; }, 400);

}

function renderDevNav() {
  const labels = QUESTIONS.map((q, i) => {
    if (q.type === 'intro') return { i, label: 'Intro' };
    if (q.type === 'safety') return { i, label: 'Safety' };
    if (q.type === 'interstitial') return { i, label: q.id === 'interstitial_1' ? 'Int1' : 'Int2' };
    if (q.type === 'analysis') return { i, label: 'Analyse' };
    if (q.type === 'email') return { i, label: 'Email' };
    if (q.type === 'result') return { i, label: 'Result' };
    const num = questionNumber(q);
    return { i, label: `Q${num}` };
  });
  $devNav.innerHTML = `<span class="dev-nav-label">Dev jump:</span>` +
    labels.map(({ i, label }) =>
      `<button class="dev-jump ${state.step === i ? 'is-active' : ''}" data-step="${i}">${label}</button>`
    ).join('');
  $devNav.querySelectorAll('.dev-jump').forEach(btn => {
    btn.addEventListener('click', () => goToStep(parseInt(btn.dataset.step, 10)));
  });
}

function render() {
  const q = currentQuestion();
  if (q.type === 'intro')          renderIntro();
  else if (q.type === 'safety')    renderSafety();
  else if (q.type === 'interstitial') renderInterstitial();
  else if (q.type === 'single')    renderSingle();
  else if (q.type === 'multi')     renderMulti();
  else if (q.type === 'silhouette') renderSilhouette();
  else if (q.type === 'email')     renderEmail();
  else if (q.type === 'analysis')  renderAnalysis();
  else if (q.type === 'result')    renderResult();
  updateChrome();
  renderDevNav();
  if (state.shouldAnimate) window.scrollTo({ top: 0, behavior: 'smooth' });
}

render();
</script>
